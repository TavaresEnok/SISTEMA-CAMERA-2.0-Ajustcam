# Canonical HTTPS entrypoint for this installation.
# The Docker services are intentionally bound to loopback; only Nginx and the
# WebRTC UDP media port are reachable from outside the host.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── O TOKEN DE MÍDIA NÃO PODE FICAR GRAVADO NO LOG ──────────────────────────
#
# As URLs de mídia (/recordings/<id>/play, /play.mp4, /thumbnail,
# /preview-sprite, /download-file, /download-zip) levam um token de acesso na
# QUERY STRING — o elemento <video> do navegador não envia cabeçalhos, então
# não existe alternativa do lado do player.
#
# Esse token é autossuficiente: quem lesse a linha do access.log baixava aquela
# gravação sem login nenhum enquanto ele valesse. Medido neste servidor: 23
# tokens completos gravados em disco. O log da APLICAÇÃO já redige (`token=
# <redacted>`); faltava o do nginx.
#
# A substituição acontece ANTES de o log tocar o disco e preserva todo o resto
# da linha (rota, status, bytes, tempo, IP, user-agent) — que é exatamente o
# que se usa para diagnosticar. Só o segredo vira REDACTED.
map $request $request_redacted {
    "~^(?<inicio>[^?]*\?[^\s]*?)token=[^&\s]*(?<fim>[^\s]*)(?<versao>\s.*)?$"  "${inicio}token=REDACTED${fim}${versao}";
    default                                                                        $request;
}

log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_redacted" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name ajustcam.ajustconsulting.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ajustcam.ajustconsulting.com.br;

    ssl_certificate /etc/letsencrypt/live/ajustcam.ajustconsulting.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ajustcam.ajustconsulting.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 512m;

    # Formato que apaga o token de mídia antes de escrever (ver `map` acima).
    access_log /var/log/nginx/access.log redacted;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Endpoint INTERNO do MediaMTX (authHTTPAddress). O MediaMTX o chama pela rede docker
    # (http://api:3000/camera-stream/mediamtx-auth) — nunca pela internet. Exposto sob
    # /api/ ele virava um oráculo público de brute-force da credencial admin do MediaMTX,
    # ainda por cima com @SkipThrottle (tentativas ilimitadas). Acertá-la dá leitura E
    # publicação em qualquer câmera, sem conta no VMS.
    # Checar IP privado no código NÃO resolveria: o NAT do docker faz o tráfego do nginx
    # chegar como 172.18.0.1 (gateway), que é privado. O corte tem de ser aqui.
    location = /api/camera-stream/mediamtx-auth { return 404; }

    # API goes directly to Nest so X-Forwarded-For contains the real client.
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # MediaMTX WHEP signaling. UDP 8189 remains the media transport exposed by
    # Docker; signaling and tokens stay under the trusted HTTPS origin.
    location /webrtc/ {
        proxy_pass http://127.0.0.1:8889/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    # HLS fallback for browsers/devices without a healthy WebRTC path.
    location /hls/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        # O MediaMTX faz um 302 de "cookieCheck" com Location relativo à raiz
        # (ex.: /cam_xxx/index.m3u8?cookieCheck=1) — SEM saber que está sob /hls/.
        # Sem reescrever, o browser segue o redirect para fora do /hls/ e cai no SPA,
        # quebrando o HLS (fallback do live e o player do mobile). Reescreve o prefixo:
        proxy_redirect ~^/(cam_.*)$ /hls/$1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    # DRAC Central (painel mestre) — sem domínio próprio; servido sob /central no
    # mesmo host HTTPS. A porta 9765 é publicada só em 127.0.0.1 (não pública); o
    # app é base-path-aware via X-Forwarded-Prefix. O trailing slash no proxy_pass
    # tira o /central/ antes de repassar (o app vê /api/..., /assets/...).
    location = /central { return 301 /central/; }
    location /central/ {
        proxy_pass http://127.0.0.1:9765/;
          # Operações da Central medem storage remoto e provisionam instalação:
          # duram dezenas de segundos por natureza. Com o padrão de 60s o nginx
          # devolvia 504 num teste que estava funcionando do outro lado.
            # 35 min de folga: com amostra grande escolhida a mao, a descida
            # leva minutos num link lento (64 MB a 1 Mb/s = 8,5 min). O app tem
            # teto proprio de 30 min; aqui so nao se pode cortar antes dele.
            proxy_read_timeout 2100s;
            proxy_send_timeout 2100s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /central;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Documentação técnica em URL curta ───────────────────────────────────
    # Serve o PDF por /manual e /doc. NÃO usa `alias` de propósito: o arquivo
    # vive em /home/flashnet (modo 750), que o www-data não consegue atravessar
    # — daria 403. O proxy reaproveita a rota que o container web já serve.
    location = /manual { proxy_pass http://127.0.0.1:5173/apk/DRAC-VMS-Documentacao.pdf; proxy_set_header Host $host; }
    location = /doc    { proxy_pass http://127.0.0.1:5173/apk/DRAC-VMS-Documentacao.pdf; proxy_set_header Host $host; }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
