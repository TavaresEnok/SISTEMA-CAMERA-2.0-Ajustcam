# ── TRADUTOR DE DIALETO RTMP ────────────────────────────────────────────────
#
# Medido em campo (2026-08-01, Positivo CIP-B1312-M): a câmera fala o dialeto
# da Adobe — releaseStream → FCPublish → createStream → publish — e ESPERA um
# `onFCPublish` antes de mandar o primeiro quadro. O MediaMTX não implementa
# esse comando (a string sequer existe no binário dele), então a câmera é
# aceita, espera a resposta que nunca vem e desiste em 1 segundo.
#
# Este nginx fala o dialeto completo, recebe o vídeo e o repassa ao MediaMTX,
# que segue sendo a fronteira de segurança: é lá que a publicação é autorizada
# contra o cadastro do DRAC. Aqui não há decisão de acesso — só tradução.
worker_processes auto;
error_log /dev/stdout info;
events { worker_connections 1024; }

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # Aceita qualquer aplicação: o nome do app é escolha do fabricante
        # (esta câmera usa "live"), e filtrar aqui recusaria equipamento antes
        # de o MediaMTX poder decidir. A autorização é lá.
        application live {
            live on;
            record off;
            # Repassa preservando o nome do fluxo, para o path no MediaMTX ficar
            # idêntico ao que o equipamento declarou — é esse nome que o
            # administrador vincula à câmera.
            push rtmp://mediamtx:1935/live;
        }

        application drac {
            live on;
            record off;
            push rtmp://mediamtx:1935/drac;
        }
    }
}

http {
    server {
        listen 8080;
        location /health { return 200 "ok\n"; }
    }
}
