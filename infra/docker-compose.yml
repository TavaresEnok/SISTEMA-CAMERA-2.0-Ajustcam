x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-50m}
    max-file: ${DOCKER_LOG_MAX_FILES:-5}

services:
  postgres:
    image: postgres:16-alpine
    container_name: vms-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-vms_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vms-net

  redis:
    image: redis:7-alpine
    container_name: vms-redis
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vms-net

  postgres-backup:
    image: postgres:16-alpine
    container_name: vms-postgres-backup
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-vms_db}
      POSTGRES_BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-14}
      POSTGRES_BACKUP_INTERVAL_SECONDS: ${POSTGRES_BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups/postgres:/backups
    command: >
      sh -c 'set -eu;
      mkdir -p /backups;
      while true; do
        ts=$$(date -u +%Y%m%dT%H%M%SZ);
        export PGPASSWORD="$$POSTGRES_PASSWORD";
        tmp="/backups/.drac-postgres-$$ts.dump.tmp";
        out="/backups/drac-postgres-$$ts.dump";
        rm -f "$$tmp";
        pg_dump -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Fc -f "$$tmp";
        pg_restore --list "$$tmp" >/dev/null;
        mv "$$tmp" "$$out";
        echo "$$(date -u +%FT%TZ) postgres_backup=ok file=$$(basename "$$out")";
        find /backups -type f -name "drac-postgres-*.dump" -mtime +$${POSTGRES_BACKUP_RETENTION_DAYS:-14} -delete;
        sleep "$${POSTGRES_BACKUP_INTERVAL_SECONDS:-86400}";
      done'
    networks:
      - vms-net

  postgres-backup-verify:
    image: postgres:16-alpine
    container_name: vms-postgres-backup-verify
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      postgres-backup:
        condition: service_started
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
      POSTGRES_BACKUP_VERIFY_INTERVAL_SECONDS: ${POSTGRES_BACKUP_VERIFY_INTERVAL_SECONDS:-86400}
      POSTGRES_BACKUP_VERIFY_INITIAL_DELAY_SECONDS: ${POSTGRES_BACKUP_VERIFY_INITIAL_DELAY_SECONDS:-900}
    volumes:
      - ./backups/postgres:/backups:ro
      - ./verify-postgres-backup.sh:/verify-postgres-backup.sh:ro
    command: ["/bin/sh", "/verify-postgres-backup.sh"]
    networks:
      - vms-net

  central-data-backup:
    image: alpine:3.20
    container_name: vms-central-data-backup
    restart: unless-stopped
    logging: *default-logging
    environment:
      CENTRAL_BACKUP_INTERVAL_SECONDS: ${CENTRAL_BACKUP_INTERVAL_SECONDS:-86400}
      CENTRAL_BACKUP_RETENTION_DAYS: ${CENTRAL_BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ${CENTRAL_DATA_DIR:-../apps/central/data}:/central-data:ro
      - ./backups/central:/backups
      - ./backup-central-data.sh:/backup-central-data.sh:ro
    command: ["/bin/sh", "/backup-central-data.sh"]

  drac-central:
    build:
      context: ..
      dockerfile: apps/central/Dockerfile
    container_name: vms-central
    hostname: vms-central
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    ports:
      - "127.0.0.1:9765:9765"
    environment:
      - NODE_ENV=production
      - DRAC_CENTRAL_HOST=0.0.0.0
      - DRAC_CENTRAL_PORT=9765
      - DRAC_CENTRAL_DATA_FILE=/app/data/installations.json
      - DRAC_CENTRAL_BACKUP_DIR=/app/data/backups
      - DRAC_CENTRAL_DATABASE_URL=postgresql://${POSTGRES_USER:-vms}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/${POSTGRES_DB:-vms_db}
      - DRAC_CENTRAL_STORE_MODE=${DRAC_CENTRAL_STORE_MODE:-dual}
      - DRAC_CENTRAL_ADMIN_EMAIL=${DRAC_CENTRAL_ADMIN_EMAIL:-admin@drac.local}
      - DRAC_CENTRAL_ADMIN_PASSWORD_HASH=${DRAC_CENTRAL_ADMIN_PASSWORD_HASH:-}
      - DRAC_CENTRAL_ADMIN_TOKEN=${DRAC_CENTRAL_ADMIN_TOKEN:-}
      - DRAC_CENTRAL_SESSION_HOURS=${DRAC_CENTRAL_SESSION_HOURS:-8}
      - DRAC_CENTRAL_ALLOWED_ORIGINS=${DRAC_CENTRAL_ALLOWED_ORIGINS:-https://localhost}
      - DRAC_CENTRAL_TRUSTED_PROXIES=${DRAC_CENTRAL_TRUSTED_PROXIES:-172.16.0.0/12}
      - DRAC_CENTRAL_COOKIE_SECURE=${DRAC_CENTRAL_COOKIE_SECURE:-true}
      - DRAC_CENTRAL_PUBLIC_URL=${DRAC_CENTRAL_PUBLIC_URL:-https://localhost/central}
      - DRAC_CENTRAL_INSTALLER_COMMIT=${DRAC_CENTRAL_INSTALLER_COMMIT:-}
      - DRAC_CENTRAL_INSTALLER_SHA256=${DRAC_CENTRAL_INSTALLER_SHA256:-}
      - DRAC_CENTRAL_INSTALLER_URL_TEMPLATE=${DRAC_CENTRAL_INSTALLER_URL_TEMPLATE:-https://raw.githubusercontent.com/TavaresEnok/DRAC/{commit}/scripts/install-drac.sh}
      - DRAC_CENTRAL_REPOSITORY_URL=${DRAC_CENTRAL_REPOSITORY_URL:-https://github.com/TavaresEnok/DRAC.git}
      - DRAC_CENTRAL_INSTALLER_TOKEN_TTL_SECONDS=${DRAC_CENTRAL_INSTALLER_TOKEN_TTL_SECONDS:-900}
      - DRAC_CENTRAL_INSTALLER_TOKEN_MAX_DOWNLOADS=${DRAC_CENTRAL_INSTALLER_TOKEN_MAX_DOWNLOADS:-3}
      - APP_BUILDER_AGENT_URL=${APP_BUILDER_AGENT_URL:-http://host.docker.internal:8780}
      - APP_BUILDER_AGENT_TOKEN=${APP_BUILDER_AGENT_TOKEN:-}
      - APP_BUILDER_AGENT_TIMEOUT_MS=${APP_BUILDER_AGENT_TIMEOUT_MS:-15000}
      - APK_SOURCE_BASE=http://web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CENTRAL_DATA_DIR:-../apps/central/data}:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9765/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vms-net

  offsite-backup:
    image: rclone/rclone:1
    container_name: vms-offsite-backup
    profiles:
      - offsite-backup
    restart: unless-stopped
    logging: *default-logging
    environment:
      OFFSITE_BACKUP_REMOTE: ${OFFSITE_BACKUP_REMOTE:-}
      OFFSITE_BACKUP_INTERVAL_SECONDS: ${OFFSITE_BACKUP_INTERVAL_SECONDS:-86400}
      OFFSITE_INCLUDE_RECORDINGS: ${OFFSITE_INCLUDE_RECORDINGS:-false}
      OFFSITE_BACKUP_TRANSFERS: ${OFFSITE_BACKUP_TRANSFERS:-4}
      OFFSITE_BACKUP_CHECKERS: ${OFFSITE_BACKUP_CHECKERS:-8}
    volumes:
      - ./backups:/data/backups:ro
      - ./storage:/data/storage:ro
      - ${KEYSTORE_BACKUP_DIR:-/home/flashnet/keystore-backups}:/data/keystores:ro
      - ${RCLONE_CONFIG_PATH:-./rclone.conf}:/config/rclone/rclone.conf:ro
      - ./offsite-backup.sh:/offsite-backup.sh:ro
    entrypoint: ["/bin/sh", "/offsite-backup.sh"]

  # ── TRADUTOR DE DIALETO RTMP (SRS) ────────────────────────────────────────
  #
  # Atende a porta pública 1935 e repassa ao MediaMTX interno. Existe porque
  # câmera legada Adobe/FMLE (medido: Positivo CIP-B1312-M) exige a resposta
  # `onFCPublish` antes de enviar vídeo, e o MediaMTX 1.18.2 não a envia — a
  # câmera conecta, é aceita e desliga em ~150 ms sem um quadro. O SRS responde
  # e repassa; provado em laboratório com a câmera de teste ficando ONLINE.
  #
  # NÃO é fronteira de segurança: a autorização de publicação continua no
  # MediaMTX → mediamtx-auth do DRAC. Path não vinculado a uma câmera é recusado
  # lá e vira tentativa pendente, igual a antes. Aqui é só tradução de protocolo.
  #
  # Imagem fixada por digest; API/HTTP/DVR do SRS desligados na srs.conf.
  rtmp-ingest:
    image: ossrs/srs@sha256:4e293846ad2448ff1a0157aa2c694e7c451fff5046c93b5bc6da0fa0384ef998
    container_name: vms-rtmp-ingest
    restart: unless-stopped
    # Endurecido em paridade com api/mediamtx: este é um parser RTMP em C++
    # exposto direto à internet na 1935, então minimiza-se o que um bug de
    # memória no handshake poderia alcançar.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 256m
    # O SRS escreve só o pid; read_only + este tmpfs cobre isso.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    logging: *default-logging
    command: ["./objs/srs", "-c", "conf/srs.conf"]
    ports:
      - "${MEDIAMTX_RTMP_PORT:-1935}:1935/tcp"
    volumes:
      - ./rtmp-ingest/srs.conf:/usr/local/srs/conf/srs.conf:ro
    depends_on:
      - mediamtx
    # SÓ rtmp-net: o tradutor alcança o MediaMTX e nada mais. Sem acesso a
    # postgres/redis/api, um SRS comprometido não tem para onde se mover.
    networks:
      - rtmp-net

  adminer:
    image: adminer:latest
    container_name: vms-adminer
    profiles:
      - admin-tools
    restart: unless-stopped
    logging: *default-logging
    networks:
      - vms-net

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: vms-api
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    # Porta em LOOPBACK: o nginx (host) faz proxy de /api/ p/ 127.0.0.1:3000. Fica no
    # compose BASE (não só no dev override) — recriar sem o override dropava a porta e
    # derrubava /api inteiro (502). Só o nginx alcança; o público não bate direto.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vms}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/${POSTGRES_DB:-vms_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CONNECT_TIMEOUT_MS=${REDIS_CONNECT_TIMEOUT_MS:-5000}
      - REDIS_STARTUP_TIMEOUT_MS=${REDIS_STARTUP_TIMEOUT_MS:-10000}
      - API_PORT=3000
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-}
      - API_PUBLIC_URL=${API_PUBLIC_URL:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-0}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - AUTH_REFRESH_INACTIVITY_DAYS=${AUTH_REFRESH_INACTIVITY_DAYS:-7}
      - CAMERA_SECRET_KEY=${CAMERA_SECRET_KEY:?CAMERA_SECRET_KEY is required}
      - CAMERA_SECRET_KEY_LEGACY=${CAMERA_SECRET_KEY_LEGACY:-}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      - EVIDENCE_HMAC_SECRET=${EVIDENCE_HMAC_SECRET:?EVIDENCE_HMAC_SECRET is required}
      - EVIDENCE_HMAC_KEY_ID=${EVIDENCE_HMAC_KEY_ID:-local-v1}
      - CLOUD_CONNECTOR_ENABLED=${CLOUD_CONNECTOR_ENABLED:-false}
      - CLOUD_API_URL=${CLOUD_API_URL:-}
      - CLOUD_INSTALLATION_ID=${CLOUD_INSTALLATION_ID:-}
      - CLOUD_LICENSE_KEY=${CLOUD_LICENSE_KEY:-}
      - CLOUD_CUSTOMER_NAME=${CLOUD_CUSTOMER_NAME:-}
      - CLOUD_HEARTBEAT_INTERVAL_SECONDS=${CLOUD_HEARTBEAT_INTERVAL_SECONDS:-60}
      - CLOUD_CONNECTOR_TIMEOUT_MS=${CLOUD_CONNECTOR_TIMEOUT_MS:-8000}
      - DRAC_VERSION=${DRAC_VERSION:-local}
      - DRAC_LAUNCH_PROFILE=${DRAC_LAUNCH_PROFILE:-standard}
      - RECORDINGS_ROOT=/storage
      # QUEM GRAVA. `local` (default) = a API sobe o ffmpeg; `worker` = a API só
      # publica o comando e quem grava é o camera-worker (profile legacy-worker).
      # Precisa ser o MESMO valor nos dois serviços: com a API em `local` e o
      # worker no ar, os dois gravariam as mesmas câmeras em paralelo. O worker
      # recusa subir fora do modo `worker` justamente para tornar isso impossível.
      - RECORDING_CONTROL_MODE=${RECORDING_CONTROL_MODE:-local}
      - POSTGRES_BACKUP_DIR=/backups/postgres
      - RECORDING_AUTO_START_ENABLED=${RECORDING_AUTO_START_ENABLED:-false}
      - RECORDING_AUTO_START_DELAY_MS=${RECORDING_AUTO_START_DELAY_MS:-10000}
      - RECORDING_DISK_GUARD_ENABLED=${RECORDING_DISK_GUARD_ENABLED:-true}
      - RECORDING_DISK_GUARD_INTERVAL_MS=${RECORDING_DISK_GUARD_INTERVAL_MS:-30000}
      - RECORDING_DISK_GUARD_MAX_USED_PERCENT=${RECORDING_DISK_GUARD_MAX_USED_PERCENT:-92}
      - MOTION_RECORDING_POST_ROLL_SECONDS=${MOTION_RECORDING_POST_ROLL_SECONDS:-90}
      - MOTION_RECORDING_SEGMENT_SECONDS=${MOTION_RECORDING_SEGMENT_SECONDS:-120}
      - MOTION_ALARM_QUIET_SECONDS=${MOTION_ALARM_QUIET_SECONDS:-300}
      # IA de identificação de OBJETO/FACE desativada (ainda não pronta p/ uso). O
      # filtro semântico ONVIF invoca o detector YOLO p/ confirmar objeto antes de
      # gravar movimento nativo; com false, o movimento nativo grava direto (fail-safe),
      # SEM carregar/rodar o detector de objeto. A análise de stream já é só o MOG2
      # (AiSettings.mode='motion'). Reative com 'true' quando a IA de objeto estiver pronta.
      - AI_ONVIF_SEMANTIC_FILTER=${AI_ONVIF_SEMANTIC_FILTER:-false}
      # Source Gateway: consumidores que só precisam de QUADROS (IA, grade, poster)
      # leem da origem já republicada pelo MediaMTX em vez de abrir mais uma
      # conexão na câmera. Gravação/pré-buffer/clipe NUNCA são reroteados (o
      # `-c copy` do bitstream original é invariante de qualidade).
      - CAMERA_SOURCE_GATEWAY_ENABLED=${CAMERA_SOURCE_GATEWAY_ENABLED:-true}
      - FFMPEG_RECORDING_CODEC_MODE=${FFMPEG_RECORDING_CODEC_MODE:-copy}
      - RETENTION_DAYS=${RETENTION_DAYS:-7}
      - RECORDING_RETENTION_DAYS=${RECORDING_RETENTION_DAYS:-7}
      - RETENTION_USE_BULLMQ=${RETENTION_USE_BULLMQ:-true}
      - MEDIAMTX_ENABLED=true
      - MEDIAMTX_API_BASE_URL=${MEDIAMTX_API_BASE_URL:-http://mediamtx:9997}
      - MEDIAMTX_RTSP_INTERNAL_URL=${MEDIAMTX_RTSP_INTERNAL_URL:-rtsp://mediamtx:8554}
      - MEDIAMTX_API_USER=${MEDIAMTX_API_USER:?MEDIAMTX_API_USER is required}
      - MEDIAMTX_API_PASS=${MEDIAMTX_API_PASS:?MEDIAMTX_API_PASS is required}
      - MEDIAMTX_AUTH_CALLBACK_TOKEN=${MEDIAMTX_AUTH_CALLBACK_TOKEN:?MEDIAMTX_AUTH_CALLBACK_TOKEN is required}
      - MEDIAMTX_PUBLIC_HOST=${MEDIAMTX_PUBLIC_HOST:-}
      - MEDIAMTX_PUBLIC_SCHEME=${MEDIAMTX_PUBLIC_SCHEME:-}
      - MEDIAMTX_PUBLIC_WEBRTC_URL=${MEDIAMTX_PUBLIC_WEBRTC_URL:-}
      - MEDIAMTX_PUBLIC_HLS_URL=${MEDIAMTX_PUBLIC_HLS_URL:-}
      - MEDIAMTX_HLS_PORT=${MEDIAMTX_HLS_PORT:-8888}
      - MEDIAMTX_WEBRTC_PORT=${MEDIAMTX_WEBRTC_PORT:-8889}
      - MEDIAMTX_HLS_ALLOW_ORIGIN=${MEDIAMTX_HLS_ALLOW_ORIGIN:-*}
      - MEDIAMTX_WEBRTC_ALLOW_ORIGIN=${MEDIAMTX_WEBRTC_ALLOW_ORIGIN:-*}
      - MEDIAMTX_WEBRTC_ADDITIONAL_HOST=${MEDIAMTX_WEBRTC_ADDITIONAL_HOST:-127.0.0.1}
      - MEDIAMTX_SOURCE_ON_DEMAND=${MEDIAMTX_SOURCE_ON_DEMAND:-false}
      - MEDIAMTX_SOURCE_ON_DEMAND_START_TIMEOUT=${MEDIAMTX_SOURCE_ON_DEMAND_START_TIMEOUT:-6s}
      - MEDIAMTX_SOURCE_ON_DEMAND_CLOSE_AFTER=${MEDIAMTX_SOURCE_ON_DEMAND_CLOSE_AFTER:-5m}
      - MEDIAMTX_RUN_ON_DEMAND_CLOSE_AFTER=${MEDIAMTX_RUN_ON_DEMAND_CLOSE_AFTER:-5m}
      - MEDIAMTX_SELECTED_RUN_ON_DEMAND_CLOSE_AFTER=${MEDIAMTX_SELECTED_RUN_ON_DEMAND_CLOSE_AFTER:-90s}
      - MEDIAMTX_WARM_PATHS_ON_BOOT=${MEDIAMTX_WARM_PATHS_ON_BOOT:-true}
      - MEDIAMTX_WARM_SELECTED_PATHS_ON_BOOT=${MEDIAMTX_WARM_SELECTED_PATHS_ON_BOOT:-false}
      - ALARM_WEBHOOK_ALLOWED_HOSTS=${ALARM_WEBHOOK_ALLOWED_HOSTS:-}
      - ALARM_WEBHOOK_SIGNING_SECRET=${ALARM_WEBHOOK_SIGNING_SECRET:-}
      - CAMERA_TEST_ALLOW_PUBLIC_IP=${CAMERA_TEST_ALLOW_PUBLIC_IP:-false}
      - CAMERA_ALLOWED_CIDRS=${CAMERA_ALLOWED_CIDRS:-}
      - CAMERA_DENIED_CIDRS=${CAMERA_DENIED_CIDRS:-}
      # Quantas câmeras degradadas o health check re-sonda por ciclo (60s).
      # NÃO é um número livre: cada sonda abre uma sessão RTSP no equipamento do
      # cliente, e DVR tem limite de sessões concorrentes. Alto demais e a sonda
      # come as sessões que a IA/gravação precisam — o DVR passa a responder
      # "SETUP failed: 503 ServerUnavailable" e a gravação por movimento morre
      # enquanto o painel jura que está só "verificando saúde".
      - HEALTH_AUTO_REMEDIATION_MAX_PER_RUN=${HEALTH_AUTO_REMEDIATION_MAX_PER_RUN:-5}
      # Sonda RTSP: stream principal Hikvision via WAN precisa de >5,5s para o
      # ffprobe fechar metadados; matar cedo = câmera saudável marcada OFFLINE.
      - CAMERA_RTSP_PROBE_TIMEOUT_MS=${CAMERA_RTSP_PROBE_TIMEOUT_MS:-4500}
      - CAMERA_RTSP_PROBE_KILL_TIMEOUT_MS=${CAMERA_RTSP_PROBE_KILL_TIMEOUT_MS:-5500}
      # Fontes quentes da grade: por RELEVÂNCIA (últimas vistas), com teto.
      # 64 cobre qualquer instalação pequena inteira; numa frota de 2.000 só as
      # 64 câmeras realmente olhadas ficam conectadas — o resto liga sob
      # demanda (~5s no primeiro acesso e entra no conjunto quente na hora).
      - MEDIAMTX_HOT_GRID_SOURCES_MAX=${MEDIAMTX_HOT_GRID_SOURCES_MAX:-64}
      - MEDIAMTX_HOT_GRID_WINDOW_HOURS=${MEDIAMTX_HOT_GRID_WINDOW_HOURS:-168}
      - FFMPEG_RTSP_FALLBACK_TRANSPORTS=tcp,udp
      - FFMPEG_RTSP_FALLBACK_PORTS=51488,51489,51490
      - FFMPEG_RTSP_ENABLE_PORT_FALLBACK=false
      - AI_AUTO_START_ENABLED=${AI_AUTO_START_ENABLED:-true}
      - AI_USE_MEDIAMTX=${AI_USE_MEDIAMTX:-false}
      - AI_RTSP_SUBTYPE=${AI_RTSP_SUBTYPE:-auto}
      - AI_ENABLED_CAMERA_IDS=${AI_ENABLED_CAMERA_IDS:-}
      - AI_ACTIVE_CAMERA_IDS=${AI_ACTIVE_CAMERA_IDS:-}
      - AI_FORCE_SINGLE_CAMERA=${AI_FORCE_SINGLE_CAMERA:-false}
      - AI_SINGLE_CAMERA_ID=${AI_SINGLE_CAMERA_ID:-}
      - AI_ANALYTICS_CAMERA_IDS=${AI_ANALYTICS_CAMERA_IDS:-}
      - AI_RTSP_STREAM_PROFILE=${AI_RTSP_STREAM_PROFILE:-analytics}
      - AI_ANALYTICS_SOURCE=${AI_ANALYTICS_SOURCE:-direct_camera}
      - AI_ANALYTICS_HEVC_FALLBACK=${AI_ANALYTICS_HEVC_FALLBACK:-true}
      # Agente de build white-label (roda no HOST; ver scripts/build-agent.mjs)
      - APP_BUILDER_AGENT_URL=${APP_BUILDER_AGENT_URL:-http://host.docker.internal:8780}
      - APP_BUILDER_AGENT_TOKEN=${APP_BUILDER_AGENT_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/storage
      - ./backups/postgres:/backups/postgres:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - vms-net

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: vms-web
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    # Porta em LOOPBACK: o nginx (host) faz proxy de / p/ 127.0.0.1:5173 (o web serve
    # na 80 interna). No compose BASE pelo mesmo motivo da api/mediamtx (não depender do
    # override — recriar sem ele derrubava o site).
    ports:
      - "127.0.0.1:5173:8080"
    # APKs white-label publicados pelo build-agent ficam num diretório do HOST
    # montado aqui (somente leitura). Sobrevive a rebuilds do container — antes os
    # APKs eram copiados pra dentro do container e sumiam a cada recriação.
    volumes:
      - ./apk:/usr/share/nginx/html/apk:ro
    # `uid`/`gid` do usuário nginx (101) são OBRIGATÓRIOS aqui.
    #
    # O container roda como `nginx` (não-root) com `read_only: true`, e um tmpfs
    # monta VAZIO e pertencendo a root — mascarando os diretórios que a imagem
    # trazia. Sem o uid/gid, o nginx não consegue criar `client_temp` e o
    # container entra em laço de reinício com
    # "mkdir() /var/cache/nginx/client_temp failed (13: Permission denied)".
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=64m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,nodev,size=8m,uid=101,gid=101
    depends_on:
      - api
      - drac-central
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vms-net

  camera-worker:
    build:
      context: ..
      dockerfile: services/camera-worker-go/Dockerfile
    container_name: vms-camera-worker
    profiles:
      - legacy-worker
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    environment:
      - REDIS_ADDR=redis:6379
      - API_URL=http://api:3000
      - CAMERA_SECRET_KEY=${CAMERA_SECRET_KEY:?CAMERA_SECRET_KEY is required}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      - STORAGE_ROOT=/storage
      # MESMO valor do serviço `api` (ver comentário lá). O worker RECUSA subir se
      # não for `worker` — sem isso, habilitar este profile com a API no default
      # `local` faria API e worker gravarem a mesma câmera ao mesmo tempo.
      - RECORDING_CONTROL_MODE=${RECORDING_CONTROL_MODE:-local}
    volumes:
      - ./storage:/storage
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    depends_on:
